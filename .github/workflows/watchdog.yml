name: watchdog

# Three Monday checks, all before NYSE opens (US winter 14:30 UTC, summer
# 13:30 UTC). Each fails if data/weekly/<previous Sunday>/summary.json is
# missing or has any non-ok strategy, so a delayed Sunday run surfaces as a
# failed-job email before the broker workflow would try to act on it.
# Off-the-hour slots because GitHub delays top-of-hour crons by 5–12 h.
on:
  schedule:
    - cron: "41 5 * * 1"
    - cron: "13 9 * * 1"
    - cron: "47 12 * * 1"
  workflow_dispatch:
    inputs:
      run_date:
        description: "Sunday run_date to check (YYYY-MM-DD). Defaults to the previous Sunday."
        required: false
        type: string

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version-file: ".python-version"

      - name: Resolve run date
        id: resolve
        run: |
          RD="${{ inputs.run_date }}"
          if [ -z "$RD" ]; then
            # Previous Sunday (UTC). Python's weekday(): Mon=0 .. Sun=6.
            RD=$(python -c "import datetime as d; t=d.date.today(); print(t - d.timedelta(days=(t.weekday()+1)%7))")
          fi
          echo "run_date=$RD" >> "$GITHUB_OUTPUT"
          echo "Watching $RD"

      - name: Verify weekly summary
        run: |
          python scripts/check_summary.py "data/weekly/${{ steps.resolve.outputs.run_date }}/summary.json"
