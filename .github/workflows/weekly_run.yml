name: weekly_run

on:
  schedule:
    # 18:00 UTC every Sunday (19:00 Warsaw winter time, 20:00 summer).
    - cron: "0 18 * * 0"
    # Backup: 04:00 UTC every Monday. Catches cases where the Sunday run
    # was delayed or skipped by GitHub. For scheduled runs the resolve step
    # derives run_date as the most recent Sunday (Monday -> yesterday), and
    # the pipeline's own "already complete" shortcut exits 0 cleanly if the
    # Sunday run already finished.
    - cron: "0 4 * * 1"
  workflow_dispatch:
    inputs:
      run_date:
        description: "Run date (YYYY-MM-DD). Defaults to most-recent Sunday (UTC)."
        required: false
        type: string
      mode:
        description: "production -> data/weekly/; test -> data/test_runs/ (never touches data/weekly/)."
        required: false
        type: choice
        default: production
        options:
          - production
          - test
      allow_late:
        description: "Allow running after the first NYSE open on-or-after run_date."
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: weekly_run
  cancel-in-progress: false

jobs:
  weekly:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      FRED_API_KEY:      ${{ secrets.FRED_API_KEY }}
      # Alpaca credentials for the price-data fallback only (read-only
      # historical bars). We reuse the XGB paper-account keys – one account,
      # three sub-accounts for execution in monday_orders.yml.
      ALPACA_KEY:        ${{ secrets.ALPACA_KEY_XGB }}
      ALPACA_SECRET:     ${{ secrets.ALPACA_SECRET_XGB }}
      PYTHONPATH:        src
      PYTHONUNBUFFERED:  "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version-file: ".python-version"
          cache: "pip"
          cache-dependency-path: "requirements.txt"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Resolve inputs
        id: resolve
        run: |
          RD="${{ inputs.run_date }}"
          if [ -z "$RD" ]; then
            # Default = most recent Sunday (today if today is Sunday).
            # Monday-dayofweek: Mon=0, Sun=6; (wd+1) % 7 maps Mon->1, Sun->0.
            RD="$(python3 -c 'import datetime as dt; d=dt.date.today(); print((d - dt.timedelta(days=(d.weekday()+1)%7)).isoformat())')"
          fi
          MODE="${{ inputs.mode }}"
          [ -z "$MODE" ] && MODE="production"
          LATE="${{ inputs.allow_late }}"
          [ "$LATE" = "true" ] && LATE_FLAG="--allow-late" || LATE_FLAG=""
          echo "run_date=$RD"   >> "$GITHUB_OUTPUT"
          echo "mode=$MODE"     >> "$GITHUB_OUTPUT"
          echo "late=$LATE_FLAG" >> "$GITHUB_OUTPUT"

      - name: Run weekly pipeline
        id: pipeline
        continue-on-error: true
        run: |
          python -m pipeline.weekly \
            --run-date "${{ steps.resolve.outputs.run_date }}" \
            --mode     "${{ steps.resolve.outputs.mode }}" \
            ${{ steps.resolve.outputs.late }}

      - name: Commit and push outputs
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for d in data/weekly data/failed data/test_runs; do
            if [ -d "$d" ]; then
              git add "$d"
            else
              echo "Skipping missing directory: $d"
            fi
          done
          if git diff --cached --quiet; then
            echo "Nothing to commit"
            exit 0
          fi
          RD="${{ steps.resolve.outputs.run_date }}"
          git commit -m "Weekly run $RD"
          git pull --rebase origin main
          git push

      # Pipeline step runs with continue-on-error so the commit step above
      # still captures whatever landed in data/failed/ or data/test_runs/.
      # Once those artefacts are safely pushed, surface the failure to the
      # job status (both production and test mode). Without this, a crash
      # like the 2026-11-18 FileNotFoundError on a clean runner leaves the
      # job green and no one notices.
      - name: Fail job if pipeline step did not succeed
        if: always()
        env:
          PIPELINE_OUTCOME: ${{ steps.pipeline.outcome }}
        run: |
          if [ "$PIPELINE_OUTCOME" != "success" ]; then
            echo "Pipeline step outcome was '$PIPELINE_OUTCOME' – failing the job."
            exit 1
          fi
          echo "Pipeline step succeeded."

      - name: Alert on any non-ok strategy
        if: always()
        env:
          RD:   ${{ steps.resolve.outputs.run_date }}
          MODE: ${{ steps.resolve.outputs.mode }}
        run: |
          if [ "$MODE" = "test" ]; then
            echo "Test mode – skipping strategy check."
            exit 0
          fi
          python scripts/check_summary.py "data/weekly/$RD/summary.json"
