name: weekly_run

on:
  schedule:
    # 18:00 UTC every Sunday (19:00 Warsaw winter time, 20:00 summer).
    - cron: "0 18 * * 0"
  workflow_dispatch:
    inputs:
      run_date:
        description: "Run date (YYYY-MM-DD). Defaults to today (UTC)."
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: weekly_run
  cancel-in-progress: false

jobs:
  weekly:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      # Secrets – never echoed. Only Anthropic and FRED are required for the
      # Sunday pipeline; Alpaca keys are not used here (the Monday order
      # workflow has its own secrets).
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      FRED_API_KEY:      ${{ secrets.FRED_API_KEY }}
      PYTHONPATH:        src
      PYTHONUNBUFFERED:  "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: ".python-version"
          cache: "pip"
          cache-dependency-path: "requirements.txt"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Resolve run date
        id: resolve
        run: |
          if [ -n "${{ inputs.run_date }}" ]; then
            RD="${{ inputs.run_date }}"
          else
            RD="$(date -u +%Y-%m-%d)"
          fi
          echo "run_date=$RD" >> "$GITHUB_OUTPUT"
          echo "Run date: $RD"

      - name: Run weekly pipeline
        id: pipeline
        run: |
          python -m pipeline.weekly --run-date "${{ steps.resolve.outputs.run_date }}"

      - name: Validate outputs
        if: always()
        run: |
          RD="${{ steps.resolve.outputs.run_date }}"
          DIR="data/weekly/$RD"
          echo "Checking artifacts in $DIR"
          test -f "$DIR/summary.json"                     || { echo "missing summary.json"; exit 1; }
          test -f "$DIR/claude_web/aggregate.json"        || { echo "missing claude_web/aggregate.json"; exit 1; }
          test -f "$DIR/claude_noweb/aggregate.json"      || { echo "missing claude_noweb/aggregate.json"; exit 1; }
          test -f "$DIR/xgb/prediction.json"              || { echo "missing xgb/prediction.json"; exit 1; }
          echo "All required artifacts present."

      - name: Commit and push weekly outputs
        if: always()
        run: |
          RD="${{ steps.resolve.outputs.run_date }}"
          DIR="data/weekly/$RD"
          if [ ! -d "$DIR" ]; then
            echo "No output directory to commit"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$DIR"
          if git diff --cached --quiet; then
            echo "Nothing to commit"
          else
            git commit -m "Weekly run $RD"
            git push
          fi
